name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: candidatures
          POSTGRES_PASSWORD: candidatures
          POSTGRES_DB: candidatures
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build et tests
        env:
          DB_PASSWORD: candidatures
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: suivi-candidatures
          path: target/suivi-candidatures-*.jar
